---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knative-pv-claim
  namespace: serving-tests
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: ceph-pv-claim
  namespace: serving-tests
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Mi
  storageClassName: ocs-storagecluster-cephfs
  volumeMode: Filesystem
